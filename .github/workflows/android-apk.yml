name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'index.html'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes build/dex build/assets build/src/ir/ahalibazar/nabard
          cp index.html build/assets/index.html
          cat > build/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.ahalibazar.nabard" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="35"/>
            <application android:label="نبرد دوستان" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > build/src/ir/ahalibazar/nabard/MainActivity.java <<'EOF'
          package ir.ahalibazar.nabard;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Color;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(16,27,49));
              getWindow().setNavigationBarColor(Color.rgb(16,27,49));
              WebView view = new WebView(this);
              view.setBackgroundColor(Color.rgb(16,27,49));
              view.getSettings().setJavaScriptEnabled(true);
              view.getSettings().setDomStorageEnabled(true);
              view.getSettings().setAllowFileAccess(true);
              view.getSettings().setAllowContentAccess(false);
              view.setWebViewClient(new WebViewClient());
              setContentView(view);
              view.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PLATFORM="$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)"
          javac -source 8 -target 8 -classpath "$PLATFORM" -d build/classes build/src/ir/ahalibazar/nabard/MainActivity.java
          "$BT/d8" --min-api 23 --lib "$PLATFORM" --output build/dex build/classes/ir/ahalibazar/nabard/MainActivity.class
          "$BT/aapt2" link -I "$PLATFORM" --manifest build/AndroidManifest.xml -A build/assets -o build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.jks -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks build/debug.jks --ks-pass pass:android --key-pass pass:android --out build/nabard-doustan.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/nabard-doustan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nabard-doustan-android
          path: build/nabard-doustan.apk
          retention-days: 7
